<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chibugbog POS — Kainan Counter</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0702;
      --surface:  #1a0e05;
      --surface2: #2a1505;
      --border:   #3a2010;
      --accent:   #e8a020;
      --accent2:  #c4956a;
      --green:    #6dbb30;
      --text:     #f5e6c8;
      --muted:    #7a5530;
      --radius:   10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 10% 20%, rgba(232,160,32,0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, rgba(196,149,106,0.05) 0%, transparent 50%);
    }

    header {
      padding: 1.6rem 2rem 1.2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 1rem;
      flex-wrap: wrap;
    }

    header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    header h1 span { color: var(--accent); }

    .tagline {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 1.5rem;
      padding: 1.5rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (max-width: 780px) {
      .main-grid { grid-template-columns: 1fr; padding: 1rem; }
    }

    /* ── MENU PANEL ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .panel-title {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.75rem;
    }

    .menu-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, background 0.15s;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .menu-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      opacity: 0;
      transition: opacity 0.15s;
    }

    .menu-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .menu-card:hover::before { opacity: 0.08; }
    .menu-card:active { transform: scale(0.97); }

    .menu-card .emoji {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.5rem;
      position: relative;
    }

    .menu-card .item-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      position: relative;
    }

    .menu-card .item-price {
      font-family: 'Lora', serif;
      font-size: 0.82rem;
      color: var(--accent);
      margin-top: 0.2rem;
      position: relative;
    }

    .menu-card .add-hint {
      position: absolute;
      top: 0.6rem; right: 0.6rem;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #0d0702;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
      font-weight: 900;
    }

    .menu-card:hover .add-hint { opacity: 1; }

    /* ── ORDER PANEL ── */
    .order-panel { display: flex; flex-direction: column; gap: 1rem; }
    .order-list  { flex: 1; min-height: 200px; }

    .order-empty {
      color: var(--muted);
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.85rem;
      text-align: center;
      padding: 2rem 0;
    }

    .order-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .order-item .oi-name {
      flex: 1;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }

    .order-item .oi-qty-ctrl {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .qty-btn {
      width: 26px; height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, border-color 0.1s;
      font-weight: 700;
    }

    .qty-btn:hover { background: var(--accent); border-color: var(--accent); color: #0d0702; }

    .qty-val {
      font-family: 'Lora', serif;
      font-size: 0.85rem;
      min-width: 20px;
      text-align: center;
    }

    .oi-sub {
      font-family: 'Lora', serif;
      font-size: 0.82rem;
      color: var(--accent);
      min-width: 52px;
      text-align: right;
    }

    .remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.1s;
    }

    .remove-btn:hover { color: #e84040; }

    /* ── TOTAL ── */
    .total-bar {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 0.05em;
    }

    .total-row.big {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.06em;
      color: var(--text);
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .total-row.big .amount { color: var(--accent); }

    /* ── PAYMENT ── */
    .pay-section { display: flex; flex-direction: column; gap: 0.6rem; }

    .pay-label {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .cash-input-row { display: flex; gap: 0.5rem; }

    .cash-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Lora', serif;
      font-size: 1rem;
      padding: 0.6rem 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .cash-input:focus { border-color: var(--accent); }
    .cash-input::placeholder { color: var(--muted); }

    .pay-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #0d0702;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      padding: 0.6rem 1.3rem;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .pay-btn:hover { opacity: 0.88; }
    .pay-btn:active { transform: scale(0.97); }
    .pay-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .change-display {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .change-display .change-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.06em;
      color: var(--green);
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 2rem; right: 2rem;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 0.9rem 1.4rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.05em;
      color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transform: translateY(120%);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
      z-index: 999;
      max-width: 280px;
    }

    #toast.show { transform: translateY(0); opacity: 1; }

    .receipt-header {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px dashed var(--border);
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<header>
  <div>
    <p class="tagline">Kainan Counter — Point of Sale</p>
    <h1>CHIBUG<span>BOG</span></h1>
  </div>
</header>

<div class="main-grid">

  <!-- LEFT: Menu -->
  <div class="panel">
    <p class="panel-title">Tap an item to add it to your order</p>
    <div class="menu-grid" id="menuGrid"></div>
  </div>

  <!-- RIGHT: Order + Payment -->
  <div class="order-panel">

    <div class="panel order-list">
      <p class="panel-title">Current order</p>
      <div id="orderItems">
        <p class="order-empty">No items yet — tap a menu card to start.</p>
      </div>
    </div>

    <div class="total-bar">
      <div class="total-row">
        <span>Items</span>
        <span id="itemCount">0</span>
      </div>
      <div class="total-row big">
        <span>Total</span>
        <span class="amount" id="totalDisplay">₱0.00</span>
      </div>
    </div>

    <div class="panel pay-section">
      <p class="pay-label">Payment</p>
      <div class="cash-input-row">
        <input
          type="number"
          class="cash-input"
          id="cashInput"
          placeholder="Cash tendered (₱)"
          min="0"
          step="1"
        />
        <button class="pay-btn" id="payBtn" disabled>Pay!</button>
      </div>
      <div class="change-display" id="changeDisplay" style="display:none;">
        <span>Change</span>
        <span class="change-val" id="changeVal">₱0.00</span>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
  // ── DATA ──────────────────────────────────────────────────────────────────
  const MENU = {
    'Lechon Paksiw Bowl': { price: 99,  emoji: '🍖' },
    'Sugpo sa Gata':      { price: 149, emoji: '🦐' },
    'Inihaw na Bangus':   { price: 129, emoji: '🐟' },
    'Tapsilog Royale':    { price: 119, emoji: '🍳' },
    'Kare-Kare Pata':     { price: 169, emoji: '🥘' },
    'Adobo Flakes Rice':  { price: 89,  emoji: '🍗' },
    'Crispy Bagnet':      { price: 159, emoji: '🥩' },
    'Longsilog Hamonado': { price: 109, emoji: '🐷' },
    'Salabat Lemonade':   { price: 59,  emoji: '🥤' },
    'Buko Pandan Shake':  { price: 79,  emoji: '🍹' },
  };

  // order = { itemName: quantity, ... }
  let order = {};

  // ── BUILD MENU CARDS ──────────────────────────────────────────────────────
  const menuGrid = document.getElementById('menuGrid');

  Object.entries(MENU).forEach(([name, { price, emoji }]) => {
    const card = document.createElement('div');
    card.className = 'menu-card';
    card.innerHTML = `
      <span class="emoji">${emoji}</span>
      <div class="item-name">${name}</div>
      <div class="item-price">₱${price}</div>
      <div class="add-hint">+</div>
    `;
    card.addEventListener('click', () => addItem(name));
    menuGrid.appendChild(card);
  });

  // ── ORDER LOGIC ───────────────────────────────────────────────────────────
  function addItem(name) {
    order[name] = (order[name] || 0) + 1;
    renderOrder();
    showToast(`Added ${name}!`);
  }

  function changeQty(name, delta) {
    order[name] = (order[name] || 0) + delta;
    if (order[name] <= 0) delete order[name];
    renderOrder();
  }

  function removeItem(name) {
    delete order[name];
    renderOrder();
  }

  function getTotal() {
    return Object.entries(order).reduce((sum, [name, qty]) => {
      return sum + (MENU[name]?.price ?? 0) * qty;
    }, 0);
  }

  function renderOrder() {
    const container = document.getElementById('orderItems');
    const total = getTotal();
    const itemCount = Object.values(order).reduce((a, b) => a + b, 0);

    document.getElementById('itemCount').textContent = itemCount;
    document.getElementById('totalDisplay').textContent = `₱${total.toFixed(2)}`;

    if (Object.keys(order).length === 0) {
      container.innerHTML = '<p class="order-empty">No items yet — tap a menu card to start.</p>';
      updatePayBtn();
      return;
    }

    container.innerHTML = Object.entries(order).map(([name, qty]) => {
      const sub = (MENU[name]?.price ?? 0) * qty;
      return `
        <div class="order-item">
          <span class="oi-name">${MENU[name]?.emoji ?? ''} ${name}</span>
          <div class="oi-qty-ctrl">
            <button class="qty-btn" onclick="changeQty('${name}', -1)">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" onclick="changeQty('${name}', +1)">+</button>
          </div>
          <span class="oi-sub">₱${sub}</span>
          <button class="remove-btn" onclick="removeItem('${name}')" title="Remove">✕</button>
        </div>
      `;
    }).join('');

    updatePayBtn();
    updateChange();
  }

  // ── PAYMENT ───────────────────────────────────────────────────────────────
  const cashInput     = document.getElementById('cashInput');
  const payBtn        = document.getElementById('payBtn');
  const changeDisplay = document.getElementById('changeDisplay');
  const changeVal     = document.getElementById('changeVal');

  function updatePayBtn() {
    const hasItems = Object.keys(order).length > 0;
    const cash  = parseFloat(cashInput.value) || 0;
    const total = getTotal();
    payBtn.disabled = !hasItems || cash < total || cash === 0;
  }

  function updateChange() {
    const cash  = parseFloat(cashInput.value) || 0;
    const total = getTotal();
    if (cash > 0 && total > 0 && cash >= total) {
      changeDisplay.style.display = 'flex';
      changeVal.textContent = `₱${(cash - total).toFixed(2)}`;
    } else {
      changeDisplay.style.display = 'none';
    }
  }

  cashInput.addEventListener('input', () => {
    updatePayBtn();
    updateChange();
  });

  payBtn.addEventListener('click', () => {
    const cash   = parseFloat(cashInput.value);
    const total  = getTotal();
    const change = cash - total;

    showToast(`✅ Order complete! Change: ₱${change.toFixed(2)}`, 4000);

    // Reset
    order = {};
    cashInput.value = '';
    changeDisplay.style.display = 'none';
    renderOrder();
  });

  // ── TOAST ─────────────────────────────────────────────────────────────────
  let toastTimer;

  function showToast(msg, duration = 1800) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), duration);
  }
</script>
</body>
</html>
